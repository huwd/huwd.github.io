publish_mode: editorial_workflow
site_url: https://huwdiprose.co.uk

backend:
  name: github
  repo: huwd/huwd.github.io
  branch: main
  base_url: https://auth-proxy.huwdiprose.co.uk
  # site_domain: localhost:4000

media_folder: /public
public_folder: /public

collections:
  - name: "reviews"
    label: "Multi-book Reviews"
    folder: "_reviews/"
    preview_path: "/review/book/{{year}}/{{month}}/{{day}}/{{title}}"
    description: "Reviews covering multiple books read together"
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    create: true
    fields:
      - { label: 'Layout', name: 'layout', widget: 'hidden', default: 'review' }
      - { label: 'Title', name: 'title', widget: 'string' }
      - { label: 'Publish Date', name: 'date', widget: 'datetime', format: 'YYYY-MM-DD', date_format: 'YYYY-MM-DD', time_format: false }
      - { label: 'Categories', name: 'categories', widget: 'hidden', default: 'review book' }
      - { label: 'Books Reviewed', name: 'books_reviewed', widget: 'list', hint: 'URLs of _books/ entries covered by this review, e.g. /review/book/2020/04/12/wolf-hall/' }
      - { label: 'Version', name: 'version', widget: 'string', default: '1.0.0' }
      - { label: 'Body', name: 'body', widget: 'markdown' }
  - label: "Pages"
    name: "pages"
    files:
      - label: "About me"
        name: "about"
        file: "about.md"
        fields:
          - { label: 'Layout', name: 'layout' }
          - { label: 'Display Title', name: 'display_title', widget: 'string' }
          - { label: 'Title', name: 'title', widget: 'string' }
          - { label: 'Permalink', name: 'permalink', widget: 'string' }
          - { label: 'Body', name: 'body', widget: 'markdown' }
  - name: "books"
    label: "Books"
    folder: "_books"
    preview_path: "/review/book/{{year}}/{{month}}/{{day}}/{{title}}"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "book" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Series", name: "series", widget: "string", required: false }
      - { label: "Series Entry", name: "series_entry", widget: "string", required: false }
      - { label: "Authors", name: "authors", widget: "list", summary: "{{fields.item}}" }
      - { label: "Work IRI", name: "work_iri", widget: "string", default: "https://www.wikidata.org/wiki/Q" }
      - { label: "Edition IRI", name: "edition_iri", widget: "string", default: "https://www.wikidata.org/wiki/Q" }
      - { label: "Date Started", name: "date_started", widget: "datetime" }
      - { label: "Date Finished", name: "date_finished", widget: "datetime", required: false }
      - { label: "Rating", name: "rating", widget: "number", required: false }
      - { label: "Publish Date", name: "date", widget: "datetime", format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false, hint: "Controls the URL — set to date finished" }
      - { label: "Categories", name: "categories", widget: "hidden", default: "review book" }
      - { label: "Version", name: "version", widget: "string", default: "1.0.0" }
      - { label: "Redirect From", name: "redirect_from", widget: "list", required: false, hint: "Old URLs that should redirect here" }
      - { label: "Body", name: "body", widget: "markdown", required: false, hint: "Leave blank if covered by a multi-book review" }
